[project]
name = "decision-pipeline-poc"
version = "0.1.0"
description = "Pipeline 4 chặng gọi các nhà cung cấp decision chuẩn Jev cho P1/P2"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: gọi nhà cung cấp thật, chỉ chạy khi DECISION_LIVE_TESTS=1",
]
